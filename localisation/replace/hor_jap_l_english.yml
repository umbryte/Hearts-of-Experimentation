 # EVENTS
 hor_events.2.t:0 "The Empire of Japan seeks to subjugate our nation Siam"
 hor_events.2.d:0 "The Japanese government has proposed a new arrangement: Siam would become a formal puppet under Japanese protection. In return, Japan promises military support and regional security as part of its Greater East Asia Co-Prosperity Sphere."
 hor_events.2.a:0 "We gladly accept the offer of our Saviors!"
 hor_events.2.b:0 "No, Siam shall stay independent!"
 
 hor_events.3.t:0 "Siam accepts our offer for subjugation of their country!"
 hor_events.3.d:0 "Siam has agreed to our proposal. They will now serve as a loyal subject under the Empire of Japan, aligned with our vision for a new Asia."
 hor_events.3.a:0 "We will save Siam!"
 
 hor_events.4.t:0 "Siam refuses our offer for subjugation of their country!"
 hor_events.4.d:0 "Siam has rejected our offer. They have chosen to maintain their independence, despite the risks of standing alone in a changing Asia."
 hor_events.4.a:0 "Damn them!"
 
