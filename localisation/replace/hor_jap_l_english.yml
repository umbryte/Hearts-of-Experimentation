 # FOCUSES
 JAP_strike_the_southern_road:0 "Strike The West"
 JAP_expand_the_kenpeitai:0 "Expand The Kenpeitai"
 JAP_expand_the_kenpeitai_desc:0 "The Kenpeitai serve as the eyes and ears of the Empire. By expanding their ranks and authority, we can strengthen our grip on occupied territories and conduct more effective intelligence operations abroad."
 JAP_fortify_the_border:0 "Raise The East-Hebei Airbases"
 JAP_fortify_the_border_desc:0 "We shall expand the East Hebei airfields to be able to project the Japanese air superiority over Northern China."
 JAP_geacps_trade4:0 "Superior Co-Prosperity Trade Bloc"
 JAP_geacps_trade4_desc:0 "With Asia and the Pacific drawn into our orbit, the Co-Prosperity Sphere has matured into a thriving trade network. Resources flow unimpeded, shipping lanes are secured, and every member benefits from unprecedented industrial efficiency."
 JAP_geacps_trade3_raj:0 "Advanced Co-Prosperity Trade Bloc"
 JAP_geacps_trade3_raj_desc:0 "The subcontinent's resources and manpower now fuel our vision. By binding India closer to the Co-Prosperity Sphere, we have vastly expanded our industrial base and secured crucial raw materials for the war effort."
 JAP_geacps_trade3_ins:0 "Advanced Co-Prosperity Trade Bloc"
 JAP_geacps_trade3_ins_desc:0 "The vast oil reserves and raw materials of the Indies strengthen our position. With these islands integrated, the Co-Prosperity Sphere has secured the energy needed to sustain industry and expand naval power."
 JAP_geacps_trade2_raj:0 "Improved Co-Prosperity Trade Bloc"
 JAP_geacps_trade2_raj_desc:0 "The gradual inclusion of India brings new opportunities for trade and access to vital resources. Though still developing, this partnership lays the foundation for stronger ties within the Sphere."
 JAP_geacps_trade2_ins:0 "Improved Co-Prosperity Trade Bloc"
 JAP_geacps_trade2_ins_desc:0 "The Indies have begun to contribute to the growing network of the Sphere. Their resources flow more steadily, granting our industries renewed strength and fueling further cooperation."
 JAP_geacps_trade1:0 "The Co-Prosperity Trade Bloc"
 JAP_geacps_trade1_desc:0 "By uniting Asia’s markets under our guidance, resources will flow more easily to Japan, strengthening our empire and our allies alike."
 JAP_singapore:0 "Take Direct Control Of Singapore"
 JAP_singapore_desc:0 "To ensure an iron grip over the region of Malaya and Singapore, the direct controller should be no other than the Empire of the Rising Sun!"
 JAP_buff_siam:0 "Forge A Stronger Siamese Military"
 JAP_buff_siam_desc:0 "Through close cooperation and shared expertise, we aim to help Siam strengthen its military capabilities and improve its readiness. A stronger Siam will contribute to regional stability and serve as a reliable partner in maintaining peace and security."
 JAP_secure_siam_resources:0 "Secure The Siamese Resources"
 JAP_secure_siam_resources_desc:0 "With Siam under our influence, we must now take steps to secure full access to their valuable resources. These materials will fuel our war effort and further strengthen Japan’s position in the region."
 JAP_reach_out_to_siam:0 "Reach Out To Siam"
 JAP_reach_out_to_siam_desc:0 "As leaders of a new Asia, we will extend our hand to Siam. Their cooperation will solidify our influence in the region and further the rise of Asian unity under Japanese guidance."
 JAP_subjugate_siam:0 "Subjugate Siam"
 JAP_subjugate_siam_desc:0 "Siam’s strategic position cannot be left uncertain. Through pressure and persuasion, we will ensure their submission to Japanese authority—for the stability and unity of Greater East Asia."
 JAP_strike_soviets:0 "Strike The East"
 JAP_strike_soviets_desc:0 "The [SOV.GetSovietThreatName] threat to our northern borders must be dealt with. We must begin preparations for a war with [SOV.GetNameDef]."
 JAP_strike_on_the_southern_resource_area:0 "Strike The West"
 JAP_non_aggression_pact_with_the_soviet_union:0 "Non-Agression Pact With The USSR"