 # EVENTS
 hor_events.15.t:0 "Manchukuo Petitions for the Return of Former Lands"
 hor_events.15.d:0 "Manchukuo asks that we return East Hebei and Dalian. Granting this would strengthen our alliance, but we may prefer to keep control ourselves."
 hor_events.15.a:0 "Return the lands to them!"
 hor_events.15.b:0 "No! East Hebei and Dalian shall stay Japanese!"
 
 hor_events.16.t:0 "The Rising Sun Grants Our Lands Back!"
 hor_events.16.d:0 "Japan has agreed to return East Hebei and Dalian. Our people celebrate this generous act that cements our bond."
 hor_events.16.a:0 "Wonderful!"
 
 hor_events.17.t:0 "The Rising Sun Denys Our Lands Back!"
 hor_events.17.d:0 "Japan has refused to return East Hebei and Dalian. While our alliance remains, our people are left disappointed."
 hor_events.17.a:0 "Well shit."
 
