 MAN_expand_tungsten:0 "Expand Tungsten Mining"
 MAN_expand_tungsten_desc:0 "Tungsten is vital for the production of advanced munitions and heavy equipment. By expanding our mining operations and improving extraction techniques, we can ensure a steady supply of this critical resource for our war industry."
 MAN_tsr_expand_tungsten:0 "Expand Tungsten Mining"
 MAN_tsr_expand_tungsten_desc:0 "Tungsten is vital for the production of advanced munitions and heavy equipment. By expanding our mining operations and improving extraction techniques, we can ensure a steady supply of this critical resource for our war industry."
 MAN_chromium_deposits:0 "Develop Chromium Deposits"
 MAN_chromium_deposits_desc:0 "Chromium is indispensable for producing durable armor and modern warships. Investing in new deposits and refining infrastructure will strengthen our ability to sustain advanced military production."
 MAN_tsr_chromium_deposits:0 "Develop Chromium Deposits"
 MAN_tsr_chromium_deposits_desc:0 "Chromium is indispensable for producing durable armor and modern warships. Investing in new deposits and refining infrastructure will strengthen our ability to sustain advanced military production."
 MAN_petroleum_investments:0 "Increase Petroleum Investments"
 MAN_petroleum_investments_desc:0 "Modern industry runs on oil, and our current reserves are far too limited. By expanding exploration and investing in extraction, we can secure the fuel needed to power our armies, factories, and future growth."
