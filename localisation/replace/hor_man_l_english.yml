 # FOCUSES
 MAN_qing_cores:0 "Restore the Northern Frontier"
 MAN_qing_cores_desc:0 "The Great Qing once ruled far into the steppes of Mongolia and the frozen reaches of Siberia. By asserting our rightful claims, we will bring these lost lands back under imperial authority."
 MAN_tsr_qing_cores:0 "Restore the Northern Frontier"
 MAN_tsr_qing_cores_desc:0 "The Great Qing once ruled far into the steppes of Mongolia and the frozen reaches of Siberia. By asserting our rightful claims, we will bring these lost lands back under imperial authority."
 MAN_port_expansion:0 "Issue Imperial Port Expansion"
 MAN_port_expansion_desc:0 "A stronger maritime network will ensure Manchuria’s prosperity and place us firmly on the world stage. We must issue an edict to expand and modernize them to take full advantage of the lifeline of our Empire."
