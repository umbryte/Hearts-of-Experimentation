 MAN_reintegrate_japan_lands:0 "Reintegrate Our Lands From The Rising Sun"
 MAN_reintegrate_japan_lands_desc:0 "Taiwan, East Hebei, and Dalian were taken during our weakness. It is time to demand their rightful return to our nation."
