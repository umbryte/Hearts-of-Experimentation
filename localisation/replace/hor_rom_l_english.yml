 # FOCUS
 ROM_reaffirm_territorial_gains:0 "Reaffirm Territorial Gains"
 ROM_reaffirm_territorial_gains_desc:0 "Bucharest emphasizes the legitimacy of the post-war treaties and frames any external challenge to its borders as a threat to regional stability. The government strengthens administrative integration in newly acquired territories, promotes national unity through education and culture, and reinforces its military posture as a guarantee that the hard-won borders will not be revised by force or diplomatic pressure."
 ROM_royal_intrigue:0 "Royal Intrigue"
 ROM_royal_intrigue_desc:0 "Despite Romania's formal democratic institutions, King Carol II continues to exert growing influence over government affairs. Through court appointments, political pressure, and manipulation of party coalitions, the Crown increasingly shapes national policy from behind the scenes. While not an outright dictatorship, the balance between monarchy and parliament is steadily eroding."
 ROM_the_craiova_trial:0 "The Craiova Trial"
 ROM_the_craiova_trial_desc:0 "Held under heavy government scrutiny, the trial is portrayed by the state as a necessary measure to defend national unity and the territorial settlement established after 1918. Critics, however, see it as a tool for consolidating power and suppressing minority political movements in regions where integration remains fragile."
 ROM_unity_and_order_decree:0 "Unity and Order Decree"
 ROM_unity_and_order_decree_desc:0 "In the aftermath of escalating political unrest and the destabilising effects of the Craiova Trials, Romania introduces the Unity and Order Decree, It authorises the detention of individuals suspected of separatist agitation, extremist organising, or collaboration with foreign political movements, often without immediate trial."
 ROM_national_renewal_directive:0 "National Renewal Directive"
 ROM_national_renewal_directive_desc:0 "Following the Unity and Order Decree, rising instability and political violence within Romania creates space for increasingly radical solutions. Conservative elites and segments of the security apparatus begin quietly shifting toward cooperation with nationalist and fascist movements as a means of restoring full control."
 ROM_the_constitutional_revival_act:0 "The Constitutional Revival Act"
 ROM_the_constitutional_revival_act_desc:0 "After years of emergency rule and rising extremism, a coalition of moderate politicians, jurists, and military officers push for a legal rollback of authoritarian powers and a return to constitutional governance."
 ROM_the_legionary_youth_integration_program:0 "The Legionary Youth Integration Program"
 ROM_the_legionary_youth_integration_program_desc:0 "In an attempt to manage growing unrest among students and young workers, Romania introduces the Legionary Youth Integration Program as a state-approved initiative designed to channel youthful political energy into structured “national service” and patriotic education."
 ROM_integration_of_national_movements:0 "Integration of National Movements"
 ROM_integration_of_national_movements_desc:0 "Under the justification of restoring order and preventing civil conflict, the government initiates the Integration of National Movements policy. Previously independent or semi-legal nationalist organisations are offered conditional legitimacy in exchange for loyalty to the state and participation in public administration."
 ROM_national_awakening_campaign:0 "National Awakening Campaign"
 ROM_national_awakening_campaign_desc:0 "The National Awakening Campaign is presented as a unifying cultural program designed to reinforce loyalty to the state and revive historical pride. Through schools, media, and public institutions, the government promotes a strong narrative of national unity, sacrifice, and continuity of the Romanian state."
 ROM_national_industrial_mobilisation_plan:0 "National Industrial Mobilisation Plan"
 ROM_national_industrial_mobilisation_plan_desc:0 "The National Industrial Mobilisation Plan is introduced as a state-led effort to modernise heavy industry, expand infrastructure, and centralise economic planning under national priorities. The government argues that economic strength is essential for preserving sovereignty and internal stability in a rapidly destabilising Europe."
 ROM_the_national_reorganisation_of_the_state:0 "National Reorganisation of the State"
 ROM_the_national_reorganisation_of_the_state_desc:0 "The National Reorganisation of the State marks the culmination of the long transition from parliamentary instability to authoritarian-national consolidation. Officially justified as a necessary response to external threats and internal fragmentation, the act dissolves the remaining pluralistic structures of government and replaces them with a centralised national leadership system."
 ROM_king_michaels_coup_hor:0 "King Michael’s Coup"
 ROM_king_michaels_coup_hor_desc:0 "As the war situation deteriorates and Soviet forces approach Romania’s borders, King Michael, supported by opposition politicians and elements of the military, orders the arrest of Antonescu and his key allies. Royal forces seize control of Bucharest, radio stations, and government ministries in a swift, coordinated operation."