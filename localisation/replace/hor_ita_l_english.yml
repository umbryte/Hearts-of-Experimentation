 # CHARACTERS
 ITA_fulangxisike_luoxi: "Francesco Rossi"

 # FOCUSES
 ITA_strengthen_libya:0 "Strengthen The Africa Settentrionale Italiana"
 ITA_strengthen_libya_desc:0 "To secure our dominance in North Africa, we must invest in the development of Libya—fortifying its defenses, improving infrastructure, and preparing local forces for the coming struggle. A well-prepared Africa Settentrionale will serve as a launchpad for operations against the Allies and safeguard our southern flank."
 ITA_puppet_yugoslavia:0 "Puppet Yugoslavia"
 ITA_puppet_yugoslavia_desc:0 "Yugoslavia's fate lies in our hands. By asserting our dominance, we will install a loyal regime that answers to Rome."
 ITA_take_yugocoast:0 "Take the Yugoslav Coastline"
 ITA_take_yugocoast_desc:0 "The Adriatic is Italy’s sea. By seizing Yugoslavia’s coastline, we secure our maritime dominance and restore our rightful influence in the region."
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "These great few years have seen the rapid expansion of the Italian state to borders near what the Romans possessed at the height of their empire. The time has come to proclaim the Mare Nostrum!"
 
