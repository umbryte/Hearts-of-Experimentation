 YUG_establish_SFRY:0 "Establish the SFRY"
 YUG_establish_SFRY_desc:0 "Now that we have came out of the war victorious, it is time to act upon our true ambitions and to enact our ultimate plan of establishing a Socialist Federal Republic of our Yugoslavia! For the people, by the people, of the people!"
 YUG_partisan_uprising:0 "Redetermination of Our Fate"
 YUG_partisan_uprising_desc:0 "Our country has been restrained under the Fascist scum's shackles for far too long! It is time to rise, fellow Partisan brothers and sisters! It is time to rise and to take back our Fatherland!"
 YUG_greater_yugoslavia_desc:0 "Our vision is complete. With the unification of South Slavic and neighboring lands under one banner, we proclaim the birth of Greater Yugoslavia — a singular, indivisible nation, rightful master of the Balkans."
 YUG_surrender_italian_claims:0 "Join the Axis"
 YUG_surrender_italian_claims_desc:0 "Yugoslavia shall no longer stand idle or weak. By joining the Axis, we embrace our destiny among the victors of a new world order—united in strength, discipline, and the triumph of the will!"
 YUG_war_on_bulgaria:0 "War on Bulgaria"
 YUG_war_on_bulgaria_desc:0 "Bulgaria defies our rightful claims. We will settle this with steel, not words."
 
