 # EVENTS
 hor_events.19.t:0 "The United States has joined the Allies."
 hor_events.19.d:0 "ATTENTIONNNN!\n\nDue to the German Reich declaring war on one OR all of these countries:\n\n§RUnited Kingdom§!\n§BThird French Republic§!\n§0Poland§!\n\nWe have been invited to the Allies faction. However, we §RCAN'T§! fight alongside our allies until we lose the §2The Sleeping Giant§! national spirit!"
 hor_events.19.a:0 "SIR, YES, SIR!"
 hor_events.18.t:0 "The United States has lend-leased us war supplies!"
 hor_events.18.d:0 "We have gained: \n§R10.000§! §BInfantry Equipment II§!  \n§R6.000§! §BTrucks§!  \n§R5.000§! §BSupport Equipment§!  \n§R4.000§! §BArtillery II§!  \n§R4.000§! §BAnti-Air II§!  \n§R4.000§! §BAnti-Tank II§!"
 hor_events.18.a:0 "God bless America!"

 # COUNTRY FLAGS
 USA_lend_lease_act_flag:0 "Has Lend-Leased"

 # TOOLTIPS
 HOR_IDEA_USA_CANT_JOIN_AND_CALL:0 "£GFX_trigger_no Can join factions\n£GFX_trigger_no Can join allied wars\n£GFX_trigger_no Can be called into allied wars"
 HOR_RULE_USA_CANT_JOIN:0 "§RThe United States must not have§! §YThe Sleeping Giant§! §Rnational spirit.§!"
 USA_lend_lease_days_tt:0 "Current days are: [?USA_lend_lease_act_flag:days|Y0]"
 USA_los_alamos_tt:0 "If there are no other §YNuclear Research Facilities§! in §Y[376.GetName]§!, we will gain §G1§! §YNuclear Research Facility§! in §Y[376.GetName]§!."
 USA_strat2_manhattan_project_tt:0 "If we don't have the §YConsolidated B-24 Liberator§! already researched, finishing this focus will §Runlock§! it for free."
 USA_hor_ll_tt:0 "We §RMUST§! own the equipment: \n§CM1 Thompson (Infantry Equipment II)§! \n§C105 mm M101A1 (Improved Artillery)§! \n§C40 mm M1 (Improved Anti-Air)§! \n§C57 mm Gun M1 (Improved Anti-Tank)§! \n§YEither through ourselves or a license§! §Obefore§! finishing this focus in order to send all the possible equipment we can from this §YLend-Lease.§!"
 
 # FOCUSES
 USA_the_sherman:0 "Standardize the Sherman"
 USA_the_sherman_desc:0 "The M4 Sherman has proven reliable, adaptable, and easy to mass-produce. By standardizing production and prioritizing resources, we can put more tanks in the field faster than any other nation."
 USA_ford_motor_company:0 "Ford Assembly Expansion"
 USA_ford_motor_company_desc:0 "The automobile industry, led by Ford, has perfected the art of mass production. By expanding assembly lines for military use, we can rapidly supply our forces with trucks and armored vehicles essential for modern warfare."
 USA_oss_to_gis:0 "From OSS to Global Intelligence Service"
 USA_oss_to_gis_desc:0 "With unmatched resources and experience, our intelligence network now spans the globe. From espionage and codebreaking to resistance coordination, our operatives are second to none."
 USA_expand_covert:0 "Expand Covert Operations"
 USA_expand_covert_desc:0 "Our intelligence service must extend its reach across occupied Europe and Asia. Expanding covert cells, sabotage units, and cryptographic divisions will give us the upper hand in the shadow war."
 USA_consolidate_oss:0 "Consolidate the OSS"
 USA_consolidate_oss_desc:0 "The OSS remains a young and fragmented organization. By consolidating its command structure and giving it greater resources, we can ensure its agents operate more effectively on a global scale."
 USA_lend_lease_commonwealth:0 "Lend-Lease the Commonwealth"
 USA_lend_lease_commonwealth_desc:0 "We must send our aid of materiel, petroleum and food to the §Y[ENG.GetNameWithFlag]§! and it's §YCommonwealth§! [CAN.GetFlag] [RAJ.GetFlag] [AST.GetFlag] [SAF.GetFlag] [NZL.GetFlag] for it is essential for the defense of the §Y[USA.GetNameWithFlag]§!!"
 USA_lend_lease_france:0 "Lend-Lease France"
 USA_lend_lease_france_desc:0 "We must send our aid of materiel, petroleum and food to the §Y[FRA.GetNameWithFlag]§! for it is essential for the defense of the §Y[USA.GetNameWithFlag]§!!"
 USA_lend_lease_soviets:0 "Lend-Lease The USSR"
 USA_lend_lease_soviets_desc:0 "We must send our aid of materiel, petroleum and food to the §Y[SOV.GetNameWithFlag]§! for it is essential for the defense of the §Y[USA.GetNameWithFlag]§!!"
 USA_all_in_for_victory:0 "All In For Victory"
 USA_all_in_for_victory_desc:0 "The time has come to commit every resource to the war effort. Industry, labor, and society as a whole must unite under one purpose: total victory."
 USA_investigate_uranium:0 "Project Y"
 USA_investigate_uranium_desc:0 "A secret laboratory will be established in New Mexico to advance uranium research. Codenamed Project Y, it will bring together leading scientists to develop new atomic technologies."

 # IDEAS
 USA_sherman:0 "M4 Sherman Production"
 USA_sherman_desc:0 "The M4 Sherman has become the backbone of our armored forces, rolling off assembly lines in unmatched numbers to overwhelm the enemy."
 USA_ford_desc:0 "Detroit’s Ford factories have been retooled for war, producing motorized and mechanized vehicles at a scale unmatched anywhere in the world."
 USA_ford:0 "Ford Manufactories"
 USA_expanded_OSS1:0 "Expanded OSS"
 USA_expanded_OSS2:0 "Expanded OSS"
 USA_expanded_OSS3:0 "Expanded OSS"
 USA_new_deal2:0 "The Second New Deal"
 USA_new_deal2_desc:0 "A set of policies and programs initiated by Franklin D. Roosevelt, a reaction to the hardships suffered during the Great Depression."
 idea_usa_neutral:0 "The Sleeping Giant"
 home_of_the_free2:0 "Home of the Free"
 home_of_the_free2_desc:0 "USA considers itself a bastion and maybe even the cradle of democracy and liberty. Whatever they choose to be, their values are difficult to compromise, however tempting some opportunities might seem."
 
 # DECISIONS
 USA_annex_mex:0 "Annex Mexico"
 hor_usa:0 "Bastion Of Democracy"
 USA_SAVE_UK:0 "Save the United Kingdom"
 USA_SAVE_UK_desc:0 "The Axis Powers have landed in mainland Britain, we must come to their aid at once!"
 pacific_war_usa:0 "The War In The Pacific"
 islands_usa:0 "The Relevant Island-Hopping Islands"
 
