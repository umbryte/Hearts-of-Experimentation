 strategic_bomber4:0 "Strategic Bomber IV"
 
 fighter_equipment_4:0 "Fighter IV"
 fighter_equipment_4_short:0 "Fighter IV"
 fighter_equipment_4_desc:0 "As air combat reaches its peak in ferocity and sophistication, this final evolution of the piston-engined fighter is designed to dominate the skies. With unmatched speed, enhanced firepower, superior maneuverability, and extended range, it represents the absolute limit of propeller-driven aircraft performance."
 cv_fighter_equipment_4:0 "Carrier Fighter IV"
 cv_fighter_equipment_4_short:1 "CV Fighter IV"
 cv_fighter_equipment_4_desc:0 "A modern fighter modified to launch from and land on aircraft carriers."
 CAS_equipment_4:0 "Close Air Support IV"
 CAS_equipment_4_short:0 "CAS IV"
 CAS_equipment_4_desc:0 "Built to provide unparalleled battlefield support, this aircraft is the ultimate refinement of ground-attack aviation. With improved durability, increased bomb capacity, and upgraded weapons systems, it can unleash devastating strikes on enemy armor and infantry while withstanding intense anti-air fire."
 cv_CAS_equipment_4:1 "Carrier Close Air Support IV"
 cv_CAS_equipment_4_short:1 "CV CAS IV"
 cv_CAS_equipment_4_desc:0 "A modern close air support plane modified to launch from and land on aircraft carriers."
 nav_bomber_equipment_4:0 "Naval Bomber IV"
 nav_bomber_equipment_4_short:0 "NAV IV"
 nav_bomber_equipment_4_desc:0 "Our naval air arm now deploys the most advanced maritime strike aircraft yet. Equipped with enhanced torpedoes, better detection systems, and longer operational range, this model ensures we maintain air superiority over the seas and can neutralize even the most heavily defended fleets."
 cv_nav_bomber_equipment_4:0 "Carrier Naval Bomber IV"
 cv_nav_bomber_equipment_4_short:1 "CV NAV IV"
 cv_nav_bomber_equipment_4_desc:0 "A modern naval bomber modified to launch from and land on aircraft carriers."
 heavy_fighter_equipment_4:0 "Heavy Fighter IV"
 heavy_fighter_equipment_4_short:0 "Heavy Fighter IV"
 heavy_fighter_equipment_4_desc:0 "Heavy fighters have evolved into deadly long-range escorts and interceptors. This final piston-engine design carries improved armor, heavier weapons, and greater fuel capacity, making it ideal for striking deep and defending against fast, high-altitude threats."
 tac_bomber_equipment_4:0 "Tactical Bomber IV"
 tac_bomber_equipment_4_short:0 "Tac Bomber IV"
 tac_bomber_equipment_4_desc:0 "Balancing versatility with power, this final iteration of the tactical bomber features enhanced precision bombing capabilities, improved avionics, and multi-role functionality, making it indispensable for both frontline and deep support missions."
 strat_bomber_equipment_4:0 "Strategic Bomber IV"
 strat_bomber_equipment_4_short:0 "Strat Bomber IV"
 strat_bomber_equipment_4_desc:0 "Strategic bombing has become a war-winning weapon, and this bomber embodies that doctrine. With unmatched range, enormous payloads, and improved survivability, it can strike targets deep in enemy territory and reshape the war from the skies."

