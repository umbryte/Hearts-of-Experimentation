 # EVENTS
 hor_events.1.t:0 "Yugoslavia seeks to join the Axis"
 hor_events.1.d:0 "After successfully signing the Tripartite pact with the Yugoslavian State to our South, the next logical step would be to join arms and integrate them under the Axis, for they also share the same sentiment on the Dawn of the New Europa!"
 hor_events.1.a:0 "We welcome the Yugoslavs to the Reich with open arms!"
 hor_events.1.b:0 "No, we have other plans in mind..."
 
